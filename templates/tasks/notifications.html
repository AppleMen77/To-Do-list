{% extends 'base.html' %}

{% block content %}
<div class="card mb-3">
    <div class="card-body">
        <h5 class="mb-0"><i class="fa-solid fa-bell me-2"></i>Уведомления</h5>
    </div>
</div>

<div class="list-group">
    {% for n in notifications %}
    <a href="{{ n.url }}" class="list-group-item task-item {% if not n.is_read %}border-start border-3 border-primary{% endif %}">
        <div class="d-flex justify-content-between align-items-center">
            <span>{{ n.message }}</span>
            <small class="text-muted">{{ n.created_at|date:"d.m H:i" }}</small>
        </div>
    </a>
    {% empty %}
    <div class="text-center py-5 text-muted">Нет уведомлений</div>
    {% endfor %}
</div>
{% endblock %}
