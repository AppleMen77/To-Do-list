{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card text-center">
            <div class="card-body py-5">
                <h5 class="mb-3">{{ item.title }}</h5>
                <small class="text-muted">Запланировано: {{ item.estimated_minutes|default:'25' }} мин</small>
                
                <div class="my-4" style="font-size: 4rem; font-weight: 700;" id="timer-display">25:00</div>
                
                <div class="d-flex justify-content-center gap-2">
                    <button class="btn btn-success" id="start-btn"><i class="fa-solid fa-play me-1"></i>Старт</button>
                    <button class="btn btn-outline-secondary" id="pause-btn"><i class="fa-solid fa-pause me-1"></i>Пауза</button>
                    <button class="btn btn-outline-danger" id="reset-btn"><i class="fa-solid fa-rotate-left me-1"></i>Сброс</button>
                </div>
                
                <div class="mt-3">
                    <small class="text-muted">Помидоров сегодня: <span id="pomodoro-count">0</span></small>
                </div>
            </div>
        </div>
        <a href="{% url 'task_list' %}" class="btn btn-outline-secondary mt-3 w-100">
            <i class="fa-solid fa-arrow-left me-1"></i>Назад к задачам
        </a>
    </div>
</div>

<script>
let timer;
let minutes = {{ item.estimated_minutes|default:25 }};
let seconds = 0;
let isRunning = false;
let pomodoroCount = localStorage.getItem('pomodoro-today') || 0;

const display = document.getElementById('timer-display');
document.getElementById('pomodoro-count').textContent = pomodoroCount;

function updateDisplay() {
    display.textContent = `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
}

function startTimer() {
    if (isRunning) return;
    isRunning = true;
    timer = setInterval(() => {
        if (seconds === 0) {
            if (minutes === 0) {
                clearInterval(timer);
                isRunning = false;
                pomodoroCount++;
                localStorage.setItem('pomodoro-today', pomodoroCount);
                document.getElementById('pomodoro-count').textContent = pomodoroCount;
                alert('Помидор завершён!');
                minutes = {{ item.estimated_minutes|default:25 }};
                updateDisplay();
                return;
            }
            minutes--;
            seconds = 59;
        } else {
            seconds--;
        }
        updateDisplay();
    }, 1000);
}

document.getElementById('start-btn').addEventListener('click', startTimer);
document.getElementById('pause-btn').addEventListener('click', () => { clearInterval(timer); isRunning = false; });
document.getElementById('reset-btn').addEventListener('click', () => {
    clearInterval(timer);
    isRunning = false;
    minutes = {{ item.estimated_minutes|default:25 }};
    seconds = 0;
    updateDisplay();
});
</script>
{% endblock %}
