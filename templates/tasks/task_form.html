{% extends 'base.html' %}

{% block content %}
<div class="card mb-3">
    <div class="card-body">
        <h5 class="mb-0"><i class="fa-solid fa-trash-can me-2"></i>Корзина</h5>
    </div>
</div>

<div class="list-group">
    {% for item in items %}
    <div class="list-group-item task-item">
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <span class="flex-grow-1">{{ item.title }}</span>
            <small class="text-muted"><i class="fa-solid fa-clock me-1"></i>{{ item.updated_at|date:"d.m.Y H:i" }}</small>
            <form method="post" action="{% url 'item_restore' item.id %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline-success"><i class="fa-solid fa-rotate-left me-1"></i>Восстановить</button>
            </form>
            <form method="post" action="{% url 'item_permanent_delete' item.id %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-delete-left me-1"></i>Удалить</button>
            </form>
        </div>
    </div>
    {% empty %}
    <div class="text-center py-5">
        <i class="fa-solid fa-trash-can mb-3" style="font-size: 3rem; color: var(--text-muted); opacity: 0.3;"></i>
        <p class="text-muted">Корзина пуста</p>
    </div>
    {% endfor %}
</div>

<div class="mt-3">
    <a href="{% url 'task_list' %}" class="btn btn-outline-secondary"><i class="fa-solid fa-arrow-left me-1"></i>Назад к задачам</a>
</div>
{% endblock %}
